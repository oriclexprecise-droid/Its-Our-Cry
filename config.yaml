# DeepSeek API 配置
deepseek:
  api_key: "sk-8d1d4a28d7a54013ac4ed8b0b9bbefda"
  base_url: "https://api.deepseek.com"
  model: "deepseek-v4-pro"

# TTS 推理参数
tts:
  text_lang: "zh"
  prompt_lang: "zh"
  text_split_method: "cut5"
  batch_size: 1
  speed_factor: 1.0
  fragment_interval: 0.3
  temperature: 1.0
  top_k: 15
  top_p: 1.0
  seed: -1

# 输出目录
output_dir: "output"
