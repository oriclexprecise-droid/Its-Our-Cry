<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyGO TTS 配音工作台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <header>
    <h1>MyGO TTS 配音工作台</h1>
    <span class="subtitle">剧本分析 → 情绪校对 → 语音合成</span>
  </header>
  <div class="layout">
  <main>
    <section id="step-input" class="panel">
      <div class="panel-header"><h2>1. 输入剧本</h2></div>
      <div class="panel-body">
        <div class="api-key-row">
          <label>DeepSeek API Key</label>
          <input type="password" id="api-key" placeholder="sk-..." autocomplete="off">
        </div>
        <textarea id="script-input" placeholder="粘贴剧本内容...&#10;&#10;格式示例：&#10;千早爱音：大家好！今天也要加油！&#10;高松灯：嗯...我会努力的。"></textarea>
        <div class="input-row">
          <div class="lang-select-row">
            <label>配音语言</label>
            <select id="script-lang">
              <option value="zh">中文</option>
              <option value="ja">日语</option>
            </select>
          </div>
          <button id="btn-analyze" class="btn-primary">分析情绪</button>
        </div>
        <div id="analyze-status" class="status-text"></div>
      </div>
    </section>
    <section id="step-review" class="panel hidden">
      <div class="panel-header">
        <h2>2. 校对台词与情绪</h2>
        <div class="panel-header-right">
          <span id="line-count"></span>
          <button id="btn-select-mode" class="btn-secondary btn-small">选择模式</button>
        </div>
      </div>
      <div class="panel-body">
        <div class="selection-toolbar hidden" id="selection-toolbar">
          <label class="select-all-label"><input type="checkbox" id="select-all"> 全选</label>
          <span id="selected-count">已选 0 条</span>
          <div class="batch-interval-row">
            <span>前间隔</span>
            <input type="number" id="batch-interval" min="0" max="10" step="0.1" value="0.5">
            <span>秒</span>
            <button id="btn-apply-interval" class="btn-secondary btn-small">应用到选中</button>
          </div>
          <span id="selection-status" class="status-text"></span>
        </div>
        <div class="lines-header">
          <span>#</span><span>角色</span><span>台词</span><span>前间隔(秒)</span><span>情绪</span><span>操作</span>
        </div>
        <div id="lines-container"></div>
        <div class="review-actions">
          <button id="btn-generate" class="btn-primary">生成全部语音</button>
          <button id="btn-merge" class="btn-primary hidden">合并音频并生成字幕</button>
          <span id="progress-text" class="status-text hidden"></span>
        </div>
      </div>
    </section>
    <section id="step-download" class="panel hidden">
      <div class="panel-header"><h2>3. 下载结果</h2></div>
      <div class="panel-body download-links">
        <div class="export-form">
          <input type="text" id="export-folder-input" placeholder="导出文件夹名称" autocomplete="off">
          <button id="btn-export-tracks" class="btn-secondary">导出</button>
        </div>
        <button id="btn-open-export" class="btn-secondary hidden">打开导出文件夹</button>
        <span id="export-status" class="status-text"></span>
      </div>
    </section>
  </main>

  <aside class="side-panels">
    <section class="panel side-panel">
      <div class="panel-header"><h2>设置</h2><button type="button" class="panel-collapse-btn" id="btn-collapse-settings" title="收起面板">▾</button></div>
      <div class="panel-body side-empty"></div>
    </section>
        <section class="panel side-panel">
      <div class="panel-header"><h2>部署</h2><button type="button" class="panel-collapse-btn" id="btn-collapse-deploy" title="收起面板">▾</button></div>
      <div class="panel-body deploy-body">
        <div id="deploy-question">
          <p class="deploy-question-text">是否已安装 GPT-SoVITS？</p>
          <div class="deploy-choice-row">
            <button id="btn-deploy-has" class="btn-secondary btn-small">已安装</button>
            <button id="btn-deploy-no" class="btn-secondary btn-small">未安装</button>
          </div>
        </div>
        <div id="deploy-has-flow" class="hidden">
          <div class="deploy-back-row"><button id="btn-deploy-back-has" class="btn-secondary btn-small">返回</button></div>
          <label class="deploy-label" for="deploy-gs-path">GPT-SoVITS 目录</label>
          <input type="text" id="deploy-gs-path" placeholder="例如 D:\GPT-SoVITS-v2pro" autocomplete="off">
          <div class="deploy-actions">
            <button id="btn-deploy-scan" class="btn-secondary btn-small">扫描环境</button>
          </div>
          <span id="deploy-scan-status" class="status-text"></span>
          <div id="deploy-scan-result" class="deploy-scan-result"></div>
          <div id="deploy-install-box" class="deploy-install-box hidden">
            <div class="deploy-progress-wrap"><div class="deploy-progress-fill" id="deploy-progress-fill"></div></div>
            <pre id="deploy-install-log" class="deploy-install-log"></pre>
          </div>
        </div>
        <div id="deploy-no-flow" class="hidden">
          <div class="deploy-back-row"><button id="btn-deploy-back-no" class="btn-secondary btn-small">返回</button></div>
          <p class="deploy-question-text">选择适合你显卡的整合包，下载后会自动解压到指定目录</p>
          <div id="deploy-download-options" class="deploy-download-options"></div>
          <label class="deploy-label" for="deploy-download-dir">解压到目录</label>
          <input type="text" id="deploy-download-dir" placeholder="例如 D:\GPT-SoVITS（新目录或空目录）" autocomplete="off">
          <div class="deploy-actions">
            <button id="btn-deploy-download" class="btn-secondary btn-small" disabled>开始下载</button>
            <button id="btn-deploy-download-cancel" class="btn-secondary btn-small hidden">取消下载</button>
          </div>
          <span id="deploy-download-status" class="status-text"></span>
          <div id="deploy-download-box" class="deploy-install-box hidden">
            <div class="deploy-progress-wrap"><div class="deploy-progress-fill" id="deploy-download-fill"></div></div>
            <pre id="deploy-download-log" class="deploy-install-log"></pre>
          </div>
        </div>
      </div>
    </section>
  </aside>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
